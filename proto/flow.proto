syntax = "proto3";
option go_package = "github.com/nonhumantrades/flowdb-go/proto";

package flowdb;

import "google/protobuf/timestamp.proto";

message Row {
    google.protobuf.Timestamp timestamp = 1;
    bytes data                          = 2;
}

enum CompressionMethod {
    CompressionNone   = 0;
    CompressionSnappy = 1;
    CompressionLZ4    = 2;
    CompressionZstd   = 3;
}

enum TimeframeUnit {
  UNIT_SECOND = 0;  
  UNIT_MINUTE = 1;  
  UNIT_HOUR   = 2;    
  UNIT_DAY    = 3;     
  UNIT_WEEK   = 4;    
  UNIT_MONTH  = 5;   
  UNIT_YEAR   = 6;    
}

message Table {
  string name                             = 1;
  uint64 row_count                        = 2;
  uint64 data_bytes                       = 3;
  google.protobuf.Timestamp min_timestamp = 4;
  google.protobuf.Timestamp max_timestamp = 5;
  google.protobuf.Timestamp last_updated  = 6;
  google.protobuf.Timestamp created_at    = 7;
}
message CreateTableRequest {
    string name                   = 1;
}

message CreateTableResponse {
    Table table = 1;
}

message DropTableRequest {
    string name = 1;
}

message DropTableResponse {}

message InsertRequest {
    string table_name = 1;
    string prefix     = 2;
    repeated Row rows = 3;
}

message InsertResponse {
    uint64 duration = 1;
}

message PrefixedRows {
    string prefix     = 1;
    repeated Row rows = 2;
}

message BatchInsertRequest {
    string table_name           = 1;
    repeated PrefixedRows items = 2;
}

message BatchInsertResponse {
    uint64 duration    = 1;
    uint64 total_rows  = 2;
}

message FilterOptions {
    optional google.protobuf.Timestamp from = 1;
    optional google.protobuf.Timestamp to   = 2;
    optional int64 limit                    = 3; // -1 = no limit, 0 = default
    optional bool reverse                   = 4;
}

message AggregationOptions {
    optional uint64 time_bucket = 1;  // For duration: nanoseconds. For calendar: multiplier (1, 2, 3...)
    optional TimeframeUnit unit = 2;  // Defaults to UNIT_SECOND for backward compatibility
}

message StreamOptions {
  optional uint32 rows_per_chunk    = 1; // 0 = default rows per chunk count
  optional uint32 target_bytes      = 2; // 0 = no bytes limit. If set, this overrides rows_per_chunk
}

message QueryRequest {
  string table_name                               = 1;
  string prefix                                   = 2;
  FilterOptions filter_options                    = 3;
  optional AggregationOptions aggregation_options = 4; 
  optional StreamOptions stream_options           = 5;
  bool head                                       = 6;
  CompressionMethod compression                   = 7; 
}

message StreamQueryHeader {
  string table_name             = 1;
  string prefix                 = 2;
  CompressionMethod compression = 3; 
}

message StreamQueryBatch {
    uint32 index      = 1;
    repeated Row rows = 2;
}

message StreamQueryFooter {
    uint64 duration             = 1;
    uint64 count                = 2;
    uint64 uncompressed_bytes   = 3;
    uint64 compressed_bytes     = 4;
    bool   truncated_by_limit   = 5;
}

message StreamQueryChunk {
    oneof chunk {
        StreamQueryHeader header = 1;
        StreamQueryBatch  batch  = 2;
        StreamQueryFooter footer = 3;
    }
}

message QueryResponse {
  string table_name             = 1;
  string prefix                 = 2;
  uint64 duration               = 3;
  uint64 count                  = 4;
  uint64 uncompressed_bytes     = 5; // logical payload bytes
  uint64 compressed_bytes       = 6; // bytes actually sent
  bool   truncated_by_limit     = 7;
  CompressionMethod compression = 8; 
  repeated Row rows             = 9;
}

message DeleteRequest {
    string table_name = 1;
    string prefix     = 2;
    optional FilterOptions filter_options = 3;
}

message DeleteResponse {
    uint64 duration = 1;
	uint64 deleted_rows = 2;
}

message GetTableRequest {
    string table_name = 1;
}

message GetTableResponse {
	Table table = 1;
}

message ListTablesResponse {
    repeated Table tables = 1;
}

message BackupChunk {
    bytes  data    = 1;
	uint64 version = 2;
}

message BackupRequest {
	uint64            version     = 1;
	CompressionMethod compression = 2;
}

message S3Config {
  string bucket     = 1;
  string url        = 2;   
  string access_key = 3;
  string secret_key = 4;
  string region     = 5;
}

// === Backup Types ===

enum BackupType {
    BACKUP_FULL = 0;
    BACKUP_INCREMENTAL = 1;
}

message BackupToS3Request {
    S3Config s3_config = 1;
    BackupType type = 2;
    string full_backup_key = 3;  // Required if type=BACKUP_INCREMENTAL
}

message BackupStarted {
    string object_key = 1;
    BackupType type = 2;
}

message BackupProgress {
    string phase = 1;            // "compressing", "uploading"
    uint64 files_processed = 2;
    uint64 total_files = 3;
    uint64 raw_bytes = 4;        // Uncompressed data size
    uint64 compressed_bytes = 5; // Compressed size (known after compression)
    uint64 bytes_uploaded = 6;   // Bytes uploaded to S3 so far
}

message BackupCompleted {
    string object_key = 1;
    uint64 size_bytes = 2;
    uint64 duration_ms = 3;
    string checksum = 4;
}

message BackupToS3Response {
    oneof message {
        BackupStarted started = 1;
        BackupProgress progress = 2;
        BackupCompleted completed = 3;
    }
}

// === Restore Types ===

message RestoreFromS3Request {
    S3Config s3_config = 1;
    string object_key = 2;
}

message RestoreStarted {
    bool is_incremental = 1;
    string full_backup_key = 2;
}

message RestoreProgress {
    string phase = 1;  // "downloading_full", "downloading_incr", "applying"
    uint64 bytes_downloaded = 2;
    uint64 total_bytes = 3;
}

message RestoreCompleted {
    uint64 duration_ms = 1;
    repeated string tables_restored = 2;
}

message RestoreFromS3Response {
    oneof message {
        RestoreStarted started = 1;
        RestoreProgress progress = 2;
        RestoreCompleted completed = 3;
    }
}

message DBStats {
  google.protobuf.Timestamp started_at = 1;
  uint64 uptime_seconds = 2;

  uint64 bytes_written        = 3;  
  uint64 bytes_deleted        = 4;  
  uint64 datapoints_queried   = 5;  

  uint64 create_table_requests       = 6;
  uint64 drop_table_requests         = 7;
  uint64 insert_requests             = 8;
  uint64 batch_insert_requests       = 9;
  uint64 delete_requests             = 10;
  uint64 query_requests              = 11;
  uint64 stream_query_requests       = 12;
  uint64 get_table_requests          = 13;
  uint64 list_tables_requests        = 14;
  uint64 backup_requests             = 15;
  uint64 backup_to_s3_requests       = 16;
  uint64 restore_from_s3_requests    = 17;
  uint64 total_requests              = 18;

  uint64 on_disk_bytes               = 19;
}

message Empty {}

service FlowDB {
    rpc CreateTable(CreateTableRequest)       returns (CreateTableResponse);
    rpc DropTable(DropTableRequest)           returns (DropTableResponse);
    rpc Insert(InsertRequest)                 returns (InsertResponse);
    rpc BatchInsert(BatchInsertRequest)       returns (BatchInsertResponse);
    rpc Delete(DeleteRequest)                 returns (DeleteResponse);
    rpc Query(QueryRequest)                   returns (QueryResponse);
    rpc StreamQuery(QueryRequest)             returns (stream StreamQueryChunk);
    rpc GetTable(GetTableRequest)             returns (GetTableResponse);
    rpc ListTables(Empty)                     returns (ListTablesResponse);
    rpc Backup(BackupRequest)                 returns (stream BackupChunk);
    rpc BackupToS3(BackupToS3Request)         returns (stream BackupToS3Response);
    rpc RestoreFromS3(RestoreFromS3Request)   returns (stream RestoreFromS3Response);
    rpc GetStats(Empty)                       returns (DBStats);
}
